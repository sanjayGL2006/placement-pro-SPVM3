apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: placement-pro
  labels:
    app.kubernetes.io/name: placement-pro
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: placement-pro
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: placement-pro-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          envFrom:
            - configMapRef:
                name: placement-pro-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /login.php
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /login.php
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: placement-pro
  labels:
    app.kubernetes.io/name: placement-pro
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30750
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: frontend
