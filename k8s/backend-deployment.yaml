apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: placement-pro
  labels:
    app.kubernetes.io/name: placement-pro
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: placement-pro
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: placement-pro-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5500
              name: http
          envFrom:
            - configMapRef:
                name: placement-pro-config
            - secretRef:
                name: placement-pro-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: backend-storage
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5500
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5500
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: backend-storage
          persistentVolumeClaim:
            claimName: placement-pro-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: placement-pro
  labels:
    app.kubernetes.io/name: placement-pro
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
    - port: 5500
      targetPort: 5500
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: backend
