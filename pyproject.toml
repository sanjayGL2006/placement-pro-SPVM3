[project]
name = "placement-pro"
version = "1.0.0"
description = "Placement Pro REST API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0.0",
    "flask-cors>=4.0.0",
    "PyMySQL>=1.1.0",
    "DBUtils>=3.0.0",
    "PyJWT>=2.9.0",
    "argon2-cffi>=23.1.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "lxml>=6.1.2",
    "pdfplumber>=0.11.0",
    "reportlab>=4.0.0",
    "gunicorn>=21.2.0"
]

[tool.pyrefly]
search-path = [
    "backend",
    "backend/venv/Lib/site-packages"
]
