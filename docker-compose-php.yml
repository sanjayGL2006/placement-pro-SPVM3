version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: placement-pro-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: placement_pro
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Automatically initialize the database with our schema!
      - ./php_backend/database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d placement_pro"]
      interval: 5s
      timeout: 5s
      retries: 5

  # PHP Backend API
  php_api:
    build:
      context: ./php_backend
      dockerfile: Dockerfile
    container_name: placement-pro-php-api
    ports:
      - "5500:80"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=placement_pro
      - DB_USER=postgres
      - DB_PASS=password
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./php_backend:/var/www/html
    restart: unless-stopped

  # Static HTML/JS Frontend
  frontend:
    image: nginx:alpine
    container_name: placement-pro-frontend-new
    ports:
      - "7500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    restart: unless-stopped

volumes:
  pg_data:
    driver: local
